      - "Manfred P. Wolff"
    id: "doi:10.1007/978-1-4612-1468-7"
    type: "book"
    location: "Graduate Texts in Mathematics 3, Springer, 1999"
    relationship: "formalizes"
    note: >-
      Chapters II–IV: barrelled and bornological spaces, strict inductive limits, Milman's
      theorem, duality, reflexivity, Montel spaces, completeness of duals, Pták theory.
  - title: "Topological Vector Spaces I"
    authors:
      - "Gottfried Köthe"
    id: "doi:10.1007/978-3-642-64988-2"
    type: "book"
    location: "Grundlehren der mathematischen Wissenschaften 159, Springer, 1983"
    relationship: "formalizes"
    note: "Duality, the Mackey topology, completeness and barrelled spaces, as cited in the module headers."
  - title: "Topological Vector Spaces II"
    authors:
      - "Gottfried Köthe"
    id: "doi:10.1007/978-1-4684-9409-9"
    type: "book"
    location: "Grundlehren der mathematischen Wissenschaften 237, Springer, 1979"
    relationship: "formalizes"
    note: >-
      §34 (Pták theory, closed graph and open mapping theorems) and §35 (webbed spaces and De
      Wilde's theorems, localization, codimension results, ultrabornological spaces).
  - title: "Topological Vector Spaces, Chapters 1–5"
    authors:
      - "N. Bourbaki"
    id: "doi:10.1007/978-3-642-61715-7"
    type: "book"
    location: "Elements of Mathematics, Springer, 1987"
    relationship: "formalizes"
    note: "Chapters II–IV: bipolar theorem, barrels, duality, Alaoglu–Bourbaki, completeness."
  - title: "Topological Vector Spaces (second edition)"
    authors:
      - "Lawrence Narici"
      - "Edward Beckenstein"
    id: "isbn:9781584888666"
    type: "book"
    location: "Chapman and Hall/CRC, 2010"
    relationship: "background"
  - title: "Closed Graph Theorems and Webbed Spaces"
    authors:
      - "Marc De Wilde"
    type: "book"
    location: "Pitman, 1978"
    relationship: "background"
    note: "Original source of webbed spaces; the formalization follows Köthe II §35."
  - title: "Completeness and the open mapping theorem"
    authors:
      - "Vlastimil Pták"
    type: "paper"
    location: "Bulletin de la Société Mathématique de France 86 (1958)"
    relationship: "background"
  - title: "A Course in Functional Analysis (second edition)"
    authors:
      - "John B. Conway"
    type: "book"
    location: "Graduate Texts in Mathematics 96, Springer, 1990"
    relationship: "background"
  - title: "Introduction to Topological Vector Spaces (lecture notes)"
    authors:
      - "Bill Casselman"
    type: "other"
    location: "University of British Columbia, 2016"
    relationship: "background"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Extends Mathlib's library of locally convex spaces (seminorms, von Neumann bounded
      sets, barrelled spaces and Banach–Steinhaus, polars, weak and strong duals, Montel
      spaces, Hahn–Banach separation, Krein–Milman, test functions, Schwartz space). The new
      space classes are defined through seminorms in the style of Mathlib's BarrelledSpace.
  - id: "https://github.com/leanprover-community/mathlib4/pull/26345"
    relationship: "adapts"
    note: >-
      Open Mathlib PR (C. Hoskin) proving the bipolar theorem for a pairing. The project's
      bipolar theorem was written after reading it; the statement is reformulated and the
      proof is organized differently. See the notes in LocallyConvexSpaces/Bipolar.lean.
  - id: "https://github.com/leanprover-community/mathlib4/pull/41166"
    relationship: "adapts"
    note: >-
      Open Mathlib PRs #40983 and #41166 (K. H. Wilson) generalize the open mapping theorem to
      F-spaces. The project contains adapted duplicates of support lemmas of #40983, under the
      same names, and its successive-approximation argument follows the organization of the
      proof in #41166; see the notes in TopologicalVectorSpaces/Basic.lean and
      TopologicalGroups/NearlyOpen.lean.
  - id: "https://github.com/leanprover-community/mathlib4/pull/26339"
    relationship: "independent"
    note: >-
      Draft Mathlib PR (C. Hoskin) towards the Banach–Dieudonné lemma for normed spaces; the
      project proves it independently for first-countable topological vector spaces.
  - id: "https://github.com/leanprover-community/mathlib4/pull/43747"
    relationship: "independent"
    note: >-
      Open Mathlib PR (yuanyi-350) characterizing dense real submodules by annihilators; the
      project's Transpose.lean proves the pointwise statement over ℝ or ℂ independently.
  - id: "https://github.com/leanprover-community/mathlib4/pull/34106"
    relationship: "independent"
    note: >-
      Draft Mathlib PR (A. Dedecker) on quotient group seminorms; the project's
      QuotientSeminorm.lean is the independently obtained analogue for seminorms over a field.
  - id: "https://github.com/mrdouglasny/gaussian-field"
    relationship: "independent"
    note: >-
      Independent Lean development (M. R. Douglas, Y. Tanimoto) of nuclear spaces and Gaussian
      measures on duals of nuclear Fréchet spaces; nuclear spaces are not treated in lean-LCS.

status:
  scope: >-
    Formalized: the results listed in the description, together with supporting theory of
    gauges, seminorm families, completions, quotients, final locally convex topologies,
    transposes, local Banach spaces and projective limits, Banach disks and fast convergence,
    and permanence of webbedness. Scalars are ℝ or ℂ except where a statement holds over a
    more general normed field. Not formalized: (DF)-spaces, nuclear and Schwartz-type spaces
    in general, tensor products, and non-archimedean spaces. Specializations to Banach spaces are left to Mathlib.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      framework: "Codex"
      models: ["gpt-6-astra"]
    - method: "agent"
      framework: "Claude Code"
      models: ["claude-fable-5-1", "claude-opus-5-5"]
      tool_setup: >-
        Terminal coding agents working in the repository under the project rules in AGENTS.md:
        `lake build` output as the only proof state, no new axioms, no sorry in the library,
        and a note beside every declaration that duplicates an open Mathlib pull request.
        Claude Opus 5.5 was used for the final code review, the Mathlib-style renaming, the
        upgrade to Lean and Mathlib v4.35.0-rc2 and the preparation of this submission.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
  spend_usd: "subscription-based"
  notes: >-
    Human-directed, agent-assisted mathematical development, proof writing, debugging and
    review, validated throughout by Lean builds. The author chose the material, the
    conventions and the sources and directed the work; coding agents wrote most of the Lean
    text. Historical model versions and per-session costs are not reconstructed here.
    Challenge.lean copies the needed library definitions verbatim and states the compared
    theorems with sorry; Solution.lean restates them and proves each by the corresponding
    library theorem.

fidelity:
  divergences: >-
    Bornological, quasi-barrelled and ultrabornological spaces are defined through seminorms,
    in the style of Mathlib's BarrelledSpace; theorems prove the equivalence with the
    classical definitions by absorbing sets for real and complex spaces. The test spaces in
    the definition of ultrabornological spaces are complete seminormed spaces in the universe
    of the space. Local convexity is expressed as LocallyConvexSpace ℝ E. A Fréchet space is a
    Hausdorff, complete, first-countable locally convex space. Results without Hausdorffness
    are stated for complete, first-countable locally convex spaces. A reflexive space is a
    semi-reflexive space whose canonical map into the strong bidual is inducing. Strict inductive
    limits are countable and carry the final locally convex topology. De Wilde's theorems are stated for
    sequentially closed graphs, with webs as in Köthe II §35. Milman's theorem is stated for
    real spaces. The Alaoglu–Bourbaki theorem is stated over a proper nontrivially normed
    field.

review:
  status: "agent-reviewed"
  notes: >-
    The library builds with Lean and Mathlib v4.35.0-rc2 without errors, warnings or sorry,
    with warnings treated as errors in continuous integration, and passes Mathlib's
    environment linters. MainResults.lean checks the axioms of the headline theorems. The
    compared declarations use only propext, Quot.sound and Classical.choice. Before the
    official run, the definitions and statements of Challenge.lean were checked to elaborate
    to the same terms as the library's by comparing fully elaborated expressions. Comparator
    (lake comparator of Lean v4.35.0-rc2, with the con-ron, NanoDa and Lean kernels) accepts
    Solution.lean for all 52 compared theorems. The code was reviewed by coding agents for
    generality, Mathlib naming, docstrings and provenance. Palomar's editorial review is
    pending. No independent human peer review is claimed.


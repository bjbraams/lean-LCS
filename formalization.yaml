# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of lean-LCS.
version: "v0.4"

project:
  name: "lean-LCS: locally convex spaces, duality, and closed graph theorems in Lean 4"
  description: >-
    A Lean 4 formalization, built on Mathlib, of the basic theory of locally convex
    topological vector spaces over the real or complex numbers. It covers barrelled,
    quasi-barrelled, bornological and ultrabornological spaces; the closed graph and open
    mapping theorems for barrelled spaces, and Pták's closed graph and open mapping theorems;
    duality theory with the bipolar, Alaoglu–Bourbaki, Mackey, Mackey–Arens, Banach–Dieudonné
    and Krein–Šmulian theorems and Grothendieck's completeness theorem; semi-reflexive,
    reflexive and Montel spaces with their permanence properties; completeness of strong
    duals; countable strict inductive limits, with the Dieudonné–Schwartz theorem; Milman's
    converse to the Krein–Milman theorem; and webbed spaces with De Wilde's closed graph and
    open mapping theorems. The Palomar entry compares 52 theorems from these areas; their
    statements and the notions they use are in Challenge.lean. The results are classical
    textbook and research results; the formalization proves them without sorry and without
    additional axioms.
  authors:
    - "Bastiaan J. Braams"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Bastiaan J. Braams"

classification:
  arxiv: ["math.FA"]
  msc2020: ["46A03", "46A08", "46A30", "46A20", "46A25", "46A13", "46A04"]


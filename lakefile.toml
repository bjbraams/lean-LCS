name = "LeanLCS"
version = "0.1.1"
defaultTargets = ["LeanLCS"]
buildDir = ".lake/build-LCS"

[leanOptions]
# Mathlib convention: undeclared names in statements are errors, not auto-bound implicits.
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "LeanLCS"
roots = [
  "LeanLCS", "MathlibExtras", "TopologicalGroups", "TopologicalVectorSpaces",
  "LocallyConvexSpaces", "WebbedSpaces",
]
globs = [
  "LeanLCS", "MainResults",
  "MathlibExtras", "MathlibExtras.+",
  "TopologicalGroups", "TopologicalGroups.+",
  "TopologicalVectorSpaces", "TopologicalVectorSpaces.+",
  "LocallyConvexSpaces", "LocallyConvexSpaces.+",
  "WebbedSpaces", "WebbedSpaces.+",
]

# The Palomar statement surface (imports Mathlib only, with deliberate `sorry`s) and its proofs.
# They are not default targets, so that `lake build --wfail` is not affected by the `sorry`s.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Shared upgrade snapshot, 2026-10-18: Lean v4.36.0-rc1.
rev = "911003dd6dea5df215dff57f2717be762e11a6ca"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "a049b4264d2cf4dbf4720796f844a3a3764914a5"

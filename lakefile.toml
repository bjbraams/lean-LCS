name = "LeanLCS"
version = "0.1.1"
defaultTargets = ["LeanLCS"]

[[lean_lib]]
name = "LeanLCS"
roots = [
  "LeanLCS", "MathlibExtras", "TopologicalGroups", "TopologicalVectorSpaces",
  "LocallyConvexSpaces", "WebbedSpaces",
]
globs = [
  "LeanLCS", "MainResults",
  "MathlibExtras", "MathlibExtras.+",
  "TopologicalGroups", "TopologicalGroups.+",
  "TopologicalVectorSpaces", "TopologicalVectorSpaces.+",
  "LocallyConvexSpaces", "LocallyConvexSpaces.+",
  "WebbedSpaces", "WebbedSpaces.+",
]

# The Palomar statement surface (imports Mathlib only, with deliberate `sorry`s) and its proofs.
# They are not default targets, so that `lake build --wfail` is not affected by the `sorry`s.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"
